<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HeronBo · AI 视频工作台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header>
  <div class="brand">HeronBo · AI 视频工作台<small id="projName">未选项目</small></div>
  <div class="spacer"></div>
  <span class="build" id="buildStamp">—</span>
  <button class="iconbtn" id="btnTheme">主题 · 原版</button>
  <button class="iconbtn" id="btnHelp" title="整条流程一张板子：现在该谁动手、点一下就执行">？流程指挥台</button>
</header>

<!-- 流程条：一眼知道走到哪、下一步谁动手 -->
<div class="flowbar" id="flow"></div>
<div class="nextbar">
  <span class="k">当前</span>
  <div class="t" id="nextText">正在读项目…</div>
  <button class="btn" id="nextBtn" disabled>执行</button>
  <button class="btn ghost" id="btnPrev" title="上一步">← 上一步</button>
  <button class="btn ghost" id="btnNext" title="下一步">下一步 →</button>
  <button class="btn ghost" id="btnClassic" title="旧 Tk 界面（排查问题时用）">经典界面</button>
</div>

<div class="work" id="work">

  <section class="col">
    <div class="colhead"><h2><span class="no">1</span><span class="cn">项目</span></h2>
      <div class="acts">
        <button class="iconbtn sm" id="btnSort" title="项目列表排序（也能直接拖动项目改名次）"><span class="lab">排序 · 默认</span></button>
        <button class="ibtn refbtn" id="btnRefresh" title="重新扫描样本库" data-icon="reload"></button>
      </div></div>
    <div class="colbody">
      <div class="seclab">样本库</div>
      <div class="pathtext" id="rootPath" title=""></div>
      <button class="btn ghost sm wide" id="btnNewProj"
              title="起一个干净项目：空素材、空提示词，名字留空会自动起一个">＋ 新建项目</button>
      <div class="note bad" id="rootIssue" hidden></div>
      <div id="sampleList" class="list"></div>
      <div class="seclab">当前项目
        <button class="ibtn sm" id="btnOpenProj" title="在资源管理器里打开当前项目目录" data-icon="folder"></button>
      </div>
      <div id="projCard" class="card"></div>
    </div>
  </section>

  <div class="split" data-col="1" title="拖动改这一栏的宽窄（双击恢复默认）"></div>

  <section class="col">
    <div class="colhead"><h2><span class="no">2</span><span class="cn">文案/素材识别</span></h2>
      <div class="acts">
        <button class="btn" id="btnIntakeGo">建框架归类</button></div></div>
    <div class="colbody" id="col2">
      <div class="dropzone" id="dz">
        <b>把素材拖到这里</b>
        图片 / 视频 / 音频 / 文本，也可整文件夹
        <small id="dzHint">文件夹请用下面的「选文件夹」（浏览器拿不到文件夹路径）</small>
        <button class="btn ghost" id="btnPick">选择素材</button>
        <button class="btn ghost" id="btnPickDir" style="margin-left:6px">选文件夹</button>
      </div>
      <div class="seclab">文案 / 素材识别
        <button class="ibtn sm" id="btnAddMat" title="添加素材（图片/视频/音频/文本）" data-icon="plus"></button>
        <button class="ibtn sm" id="btnOpenMat" title="在资源管理器里打开 素材/" data-icon="folder"></button>
        <button class="btn ghost sm" id="btnCheckRole" style="float:right"
                title="软件只按文件名/扩展名猜角色，不一定准。出提示词时 agent 会默认逐件核对（含视频类别）；这个按钮是让它在不生成提示词的情况下单独重判一次">重新归类</button>
      </div>
      <div class="needbox">
        <textarea id="need" rows="2"
          placeholder="你的简单需求（一句话说清要什么；agent 出提示词与核对归类时都按它来）"></textarea>
        <div class="needfoot"><span class="meta" id="needHint">改完点「存」</span>
          <button class="btn ghost sm" id="btnSaveNeed">存</button></div>
      </div>
      <div class="matbox" id="matBox">
        <div id="pendList" class="list"></div>
        <div id="matList" class="list"></div>
      </div>
    </div>
  </section>

  <div class="split" data-col="2" title="拖动改这一栏的宽窄（双击恢复默认）"></div>

  <section class="col">
    <div class="colhead"><h2><span class="no">3</span><span class="cn">分镜 / 提示词</span></h2>
      <div class="acts">
        <button class="agentchip" id="btnAgent" title="点一下看本机有哪些 agent">agent —</button>
        <button class="ibtn refbtn" id="btnLoadPrompts" title="重新读取提示词" data-icon="reload"></button>
        <button class="btn" id="btnAsk">出提示词</button></div></div>
    <div class="colbody">
      <div class="prog" id="prog" hidden>
        <div class="top"><span class="s" id="pstage">正在叫 agent…</span>
          <span class="tm" id="ptime"></span>
          <button class="btn ghost sm danger" id="btnStop" title="这一轮卡住/跑飞了可以停掉（结果不算数，可重跑）">停止</button></div>
        <div class="bar"><i id="pfill"></i></div>
        <div class="stages" id="pstages"></div>
      </div>
      <div class="seclab">提示词正文
        <button class="ibtn sm" id="btnCheckPrompt"
          title="提示词体检：按《统一骨架》检查这份提示词（小节齐不齐、顺序对不对、正文里有没有混进表格）">✓</button>
        <button class="ibtn sm" id="btnCopyBody"
          title="一键复制这段正文（只复制提示词本身，不带上传清单）" data-icon="copy"></button>
        <span class="meta" id="stageLab"></span>
        <span class="meta" id="curLab"></span></div>
      <div class="vbox" id="promptWrap"><div class="prompt" id="promptBox">（还没有提示词正文）</div></div>
      <div class="seclab">即梦上传清单
        <button class="ibtn sm" id="btnOpenUp" title="在资源管理器里打开 即梦上传/（按版本分子目录）"
          data-icon="folder"></button>
      </div>
      <div class="upbox" id="upBox"><div id="upList" class="list"></div></div>
      <div class="seclab">成片 / 废片</div>
      <div class="rowline">
        <button class="btn ghost" id="btnGood">收成片</button>
        <button class="btn ghost danger" id="btnBad">收废片</button>
        <input id="why" placeholder="废因（废片必填）">
      </div>
      <div class="seclab">本轮反馈</div>
      <textarea id="fb" rows="3" placeholder="哪里好、哪里不对？写清现象，agent 好照着改"></textarea>
      <div class="rowline">
        <button class="btn ghost" id="btnLearn" title="把 评价/*.json、废片废因 交给 agent，沉淀回 references/rules*.md">评价反哺 skill</button>
        <button class="btn" id="btnSubmitFb">提交反馈 · 再出一版</button>
      </div>
      <div class="seclab">执行记录
        <button class="btn ghost sm" id="btnRecords" style="float:right"
                title="看 agent 每一轮到底干了什么（工作台每轮自己记一份）">对话记录</button>
      </div>
      <div class="vbox" id="logWrap"><div class="log" id="log"></div></div>
    </div>
  </section>

  <div class="split" data-col="4" title="拖动改这一栏的宽窄（双击恢复默认）"></div>

  <section class="col">
    <div class="colhead"><h2><span class="no">4</span><span class="cn">评分</span></h2>
      <div class="acts"><button class="ibtn refbtn" id="btnReload" title="重新载入上次评分" data-icon="reload"></button>
        <button class="btn" id="btnSave">保存评分</button></div></div>
    <div class="colbody" id="scoreCol">
      <div class="fld"><label>成片</label><span class="selwrap"><select id="videoSel"></select></span></div>
      <div id="dimBox"></div>
      <div class="fld"><label>违禁项</label><div id="forbidBox" class="rowline"></div></div>
      <div class="fld"><label>整体评分</label><span class="stars" id="stars"></span></div>
      <div class="fld"><label>结论</label><span class="seg" id="conclBox"></span></div>
      <div class="fld" style="align-items:start"><label>备注</label>
        <textarea id="note" rows="3" placeholder="哪里好、哪里不对？"></textarea></div>
      <div class="note ok" id="saveHint">保存后进 <code>评价/</code>，下一版提示词按它改。</div>
    </div>
  </section>

</div>

<!-- 流程指挥台：独立 HTML 页（flow.html）嵌进来，整条流程一张板子 —— 不是弹窗 -->
<div class="boardwrap" id="boardWrap" hidden>
  <iframe id="boardFrame" title="流程指挥台"></iframe>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
